[package]
name = "tools-audit-tool"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
redis = { version = "0.23", features = [] }
rumqttc = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
agile_common = { path = "../../crates/common" }
agile_config = { path = "../../crates/config" }
futures = "0.3"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
async-stream = "0.3"
tokio-stream = "0.1"
futures-util = "0.3"

[dev-dependencies]
