[package]
name = "tools_publish_event"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "publish_event"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
agile_common = { path = "../../crates/common" }
agile_bus_mqtt = { path = "../../crates/bus_mqtt" }
clap = { version = "4.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }
